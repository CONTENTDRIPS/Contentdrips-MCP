name = "contentdrips-mcp"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Migrate away from the old Durable Object (now using stateless createMcpHandler)
[[migrations]]
tag = "v2"
deleted_classes = ["ContentDripsMCP"]

# Production URL: https://mcp.contentdrips.com/mcp
# Auth: Authorization: Bearer <API token> (no tokens in the URL)
# Optional: wrangler secret put OAUTH_SIGNING_SECRET

[vars]
LARAVEL_API_URL = "https://api.contentdrips.com"
RENDERER_API_URL = "https://generate.contentdrips.com"
APP_URL = "https://app.contentdrips.com"

# For local development, override these in .dev.vars:
# LARAVEL_API_URL = "http://localhost:8000"
# RENDERER_API_URL = "http://localhost:3000"
# APP_URL = "http://localhost:3000"

